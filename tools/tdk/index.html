<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDK Sözlük Araması — Gökhan Aktaş</title>
  <meta name="description" content="TDK Türkçe sözlükte madde ve anlam içinde tam metin arama.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0f1117;
      --bg2:    #1a1d27;
      --bg3:    #222536;
      --border: #2e3248;
      --text:   #e2e8f0;
      --text2:  #94a3b8;
      --accent: #6366f1;
      --accent-dim: rgba(99, 102, 241, 0.15);
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    /* Header — same as /tools */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }
    .breadcrumb-sep { color: var(--border); font-size: 16px; }
    .breadcrumb-current { color: var(--text); font-size: 13px; font-weight: 500; }

    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    /* Search */
    .searchbar { position: relative; }
    .searchbar svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      pointer-events: none;
    }
    #q {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      padding: 11px 14px 11px 42px;
      transition: border-color 0.15s;
    }
    #q:focus { outline: none; border-color: var(--accent); }
    #q::placeholder { color: var(--text2); }

    /* Scope pills */
    .scope {
      display: inline-flex;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      margin-top: 14px;
    }
    .scope button {
      border: none;
      background: none;
      color: var(--text2);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .scope button:hover { color: var(--text); }
    .scope button.active { background: var(--accent); color: #fff; }

    .status {
      margin-top: 14px;
      color: var(--text2);
      font-size: 13px;
      font-family: var(--mono);
    }

    /* Results */
    #results { margin-top: 22px; }
    .hit {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 18px;
    }
    .hit + .hit { margin-top: 10px; }
    .hit-madde {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s;
    }
    .hit-madde:hover { color: var(--accent); }
    .hit ol {
      margin-top: 6px;
      padding-left: 20px;
      color: var(--text2);
      font-size: 13.5px;
    }
    .hit ol li + li { margin-top: 2px; }
    .hit ol li::marker { color: var(--accent); font-family: var(--mono); font-size: 12px; }

    mark {
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 1px;
    }

    #more {
      display: none;
      margin: 18px auto 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font: inherit;
      font-size: 13.5px;
      padding: 8px 22px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #more:hover { color: var(--text); border-color: var(--accent); }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      color: var(--text2);
      font-size: 12px;
    }
    footer a { color: var(--text2); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 520px) {
      main { padding: 28px 16px 48px; }
      .page-title { font-size: 21px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back-link" href="/tools/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      tools
    </a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">tdk</span>
  </header>

  <main>
    <h1 class="page-title">TDK Sözlük Araması</h1>

    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="q" placeholder="Anlam içinde ara…" autocomplete="off" autofocus>
    </div>

    <div class="scope" role="group" aria-label="Arama kapsamı">
      <button class="active" data-scope="anlam">Anlam</button>
      <button data-scope="madde">Madde</button>
      <button data-scope="tumu">Tümü</button>
    </div>

    <p class="status" id="status">Sözlük yükleniyor…</p>

    <div id="results" aria-live="polite"></div>
    <button id="more">Daha fazla göster</button>
  </main>

  <footer>
    <a href="/tools/">tools</a> · <a href="https://gaktas.com/">gaktas.com</a>
  </footer>

  <script>
    'use strict';

    const $q = document.getElementById('q');
    const $status = document.getElementById('status');
    const $results = document.getElementById('results');
    const $more = document.getElementById('more');
    const nf = new Intl.NumberFormat('tr-TR');

    const BATCH = 100;      // aynı anda en fazla bu kadar madde render edilir
    const MIN_LEN = 2;

    let items = null;       // [{ m, ml, a: [...], al: [...] }]
    let scope = 'anlam';
    let matches = [];       // eşleşen item indeksleri
    let shown = 0;
    let lastQuery = '';

    const trLower = (s) => s.toLocaleLowerCase('tr');
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    /* ---------- Veri yükleme ---------- */
    fetch('data.json')
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        items = data.map(([m, a]) => ({
          m,
          ml: trLower(m),
          a,
          al: a.map(trLower),
        }));
        $status.textContent = nf.format(items.length) + ' madde hazır. Aramak için en az ' + MIN_LEN + ' karakter yazın.';
        if ($q.value.trim().length >= MIN_LEN) runSearch();
      })
      .catch(() => {
        $status.textContent = 'Sözlük verisi yüklenemedi. Sayfayı yenilemeyi deneyin.';
      });

    /* ---------- Vurgulama ----------
       Türkçe küçük harfe indirilmiş metinde konumları bulur,
       aynı konumları orijinal metinde <mark> ile sarar.
       (tr eşlemesinde İ→i ve I→ı bire bir olduğundan indeksler örtüşür.) */
    function highlight(text, lower, needle) {
      let out = '', pos = 0, i;
      while ((i = lower.indexOf(needle, pos)) !== -1) {
        out += esc(text.slice(pos, i)) + '<mark>' + esc(text.slice(i, i + needle.length)) + '</mark>';
        pos = i + needle.length;
      }
      return out + esc(text.slice(pos));
    }

    /* ---------- Arama ---------- */
    function runSearch() {
      const raw = $q.value.trim();
      lastQuery = raw;

      if (raw.length < MIN_LEN) {
        matches = [];
        $results.innerHTML = '';
        $more.style.display = 'none';
        if (items) $status.textContent = nf.format(items.length) + ' madde hazır. Aramak için en az ' + MIN_LEN + ' karakter yazın.';
        return;
      }
      if (!items) {
        $status.textContent = 'Sözlük yükleniyor, aramanız hazır olunca çalışacak…';
        return;
      }

      const needle = trLower(raw);
      matches = [];
      const inMadde = scope !== 'anlam';
      const inAnlam = scope !== 'madde';

      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (inMadde && it.ml.includes(needle)) { matches.push(i); continue; }
        if (inAnlam) {
          for (let j = 0; j < it.al.length; j++) {
            if (it.al[j].includes(needle)) { matches.push(i); break; }
          }
        }
      }

      shown = 0;
      $results.innerHTML = '';
      $status.textContent = matches.length
        ? nf.format(matches.length) + ' sonuç'
        : 'Sonuç bulunamadı.';
      renderBatch(needle);
    }

    function renderBatch(needle) {
      const end = Math.min(shown + BATCH, matches.length);
      let html = '';
      for (let k = shown; k < end; k++) {
        const it = items[matches[k]];
        const url = 'https://sozluk.gov.tr/?aranan=' + encodeURIComponent(it.m);
        let lis = '';
        for (let j = 0; j < it.a.length; j++) {
          lis += '<li>' + highlight(it.a[j], it.al[j], needle) + '</li>';
        }
        html += '<article class="hit">'
              + '<a class="hit-madde" href="' + url + '" target="_blank" rel="noopener">' + highlight(it.m, it.ml, needle) + '</a>'
              + '<ol>' + lis + '</ol>'
              + '</article>';
      }
      $results.insertAdjacentHTML('beforeend', html);
      shown = end;
      $more.style.display = shown < matches.length ? 'block' : 'none';
      if (matches.length > BATCH) {
        $status.textContent = nf.format(matches.length) + ' sonuç · ' + nf.format(shown) + ' tanesi gösteriliyor';
      }
    }

    $more.addEventListener('click', () => renderBatch(trLower(lastQuery)));

    /* ---------- Girdi ve kapsam ---------- */
    let t;
    $q.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(runSearch, 200);
    });

    document.querySelectorAll('.scope button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scope button').forEach(b => b.classList.toggle('active', b === btn));
        scope = btn.dataset.scope;
        $q.placeholder = scope === 'madde' ? 'Madde içinde ara…' : scope === 'tumu' ? 'Madde ve anlam içinde ara…' : 'Anlam içinde ara…';
        runSearch();
      });
    });
  </script>
</body>
</html>
