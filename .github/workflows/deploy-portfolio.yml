name: Deploy Portfolio

on:
  push:
    branches: [master]
    paths:
      - '_src/portfolio/**'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: _src/portfolio/package-lock.json

      - name: Install
        working-directory: _src/portfolio
        run: npm ci

      - name: Build
        working-directory: _src/portfolio
        run: npm run build
        env:
          VITE_API_URL: https://portfolio-api-765723944141.europe-west1.run.app

      - name: Deploy
        run: |
          rm -rf tools/portfolio
          cp -r _src/portfolio/dist tools/portfolio
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/portfolio
          git diff --staged --quiet || git commit -m "deploy: portfolio"
          git push
